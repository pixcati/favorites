<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
	<title>GitHub 下载加速</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta property="og:title" content="GitHub 代理加速服务" />
	<meta property="og:description" content="ghproxy, GitHub 代理加速，Github 文件加速，Github 代理下载" />
	<style>
		:root {
			--bg-primary: #ffffff;
			--bg-secondary: #f8f9fa;
			--text-primary: #1a1a2e;
			--text-secondary: #4a4a6a;
			--accent: #e89980;
			--accent-hover: #d48870;
			--border: #e5e5e5;
			--shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
			--shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.12);
			--radius: 12px;
			--radius-sm: 8px;
			--transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
		}

		[data-theme="dark"] {
			--bg-primary: #1a1a2e;
			--bg-secondary: #16162a;
			--text-primary: #f0f0f5;
			--text-secondary: #a0a0b0;
			--border: #2a2a4a;
			--shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
			--shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.5);
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			background: var(--bg-primary);
			color: var(--text-primary);
			line-height: 1.6;
			transition: var(--transition);
			min-height: 100vh;
			display: flex;
			flex-direction: column;
		}

		.header {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			padding: 0.75rem 2rem;
			display: flex;
			justify-content: space-between;
			align-items: center;
			background: var(--bg-primary);
			box-shadow: var(--shadow);
			z-index: 1000;
			transition: var(--transition);
		}

		.logo {
			font-size: 1.1rem;
			font-weight: 600;
			color: var(--text-primary);
			text-decoration: none;
			display: flex;
			align-items: center;
			gap: 0.5rem;
		}

		.logo svg {
			height: 1em;
			width: auto;
			fill: currentColor;
			color: var(--accent);
		}

		.nav-desktop a svg,
		.button svg {
			height: 1em;
			width: auto;
			fill: currentColor;
			vertical-align: -0.125em;
		}

		.nav-desktop {
			display: flex;
			align-items: center;
			gap: 0.25rem;
		}

		.nav-desktop a {
			color: var(--text-secondary);
			text-decoration: none;
			font-size: 0.9rem;
			font-weight: 500;
			transition: var(--transition);
			padding: 0.5rem 0.875rem;
			border-radius: var(--radius-sm);
			white-space: nowrap;
		}

		.nav-desktop a:hover {
			color: var(--accent);
			background: var(--bg-secondary);
		}

		.theme-toggle {
			background: var(--bg-secondary);
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			width: 38px;
			height: 38px;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			transition: var(--transition);
			color: var(--text-primary);
			margin-left: 0.5rem;
		}

		.theme-toggle:hover {
			background: var(--accent);
			color: white;
			border-color: var(--accent);
		}

		.mobile-controls {
			display: none;
			align-items: center;
			gap: 0.5rem;
		}

		.action-btn {
			background: var(--bg-secondary);
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			width: 38px;
			height: 38px;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			transition: var(--transition);
			color: var(--text-primary);
		}

		.action-btn:hover,
		.action-btn:active,
		.action-btn:focus {
			background: var(--accent);
			color: white;
			border-color: var(--accent);
		}

		.theme-toggle svg,
		.action-btn svg {
			width: 16px;
			height: 16px;
			fill: currentColor;
			flex-shrink: 0;
		}

		.icon-sun {
			display: none;
		}

		[data-theme="dark"] .icon-sun {
			display: block;
		}

		[data-theme="dark"] .icon-moon {
			display: none;
		}

		#menuToggle .menu-icon-xmark {
			display: none;
		}

		#menuToggle.is-open .menu-icon-xmark {
			display: block;
		}

		#menuToggle.is-open .menu-icon-bars {
			display: none;
		}

		.mobile-menu {
			position: relative;
		}

		.menu-dropdown {
			position: absolute;
			top: calc(100% + 8px);
			right: 0;
			background: var(--bg-primary);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			box-shadow: var(--shadow-lg);
			padding: 0.5rem;
			min-width: 150px;
			opacity: 0;
			transform: translateY(-10px);
			pointer-events: none;
			transition: var(--transition);
			z-index: 1001;
		}

		.menu-dropdown.active {
			opacity: 1;
			transform: translateY(0);
			pointer-events: auto;
		}

		.menu-dropdown a {
			display: flex;
			align-items: center;
			gap: 0.75rem;
			padding: 0.625rem 0.875rem;
			color: var(--text-secondary);
			text-decoration: none;
			font-size: 0.875rem;
			border-radius: var(--radius-sm);
			transition: var(--transition);
		}

		.menu-dropdown a:hover {
			background: var(--bg-secondary);
			color: var(--accent);
		}

		.menu-dropdown a svg {
			width: 18px;
			height: 0.875rem;
			fill: currentColor;
			flex-shrink: 0;
		}

		.main {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 6rem 2rem 3rem;
		}

		.container {
			max-width: 680px;
			width: 100%;
			text-align: center;
		}

		.icon-wrapper {
			margin-bottom: 1.5rem;
		}

		.icon-wrapper svg {
			height: 4rem;
			width: auto;
			fill: currentColor;
			color: var(--accent);
			opacity: 0.9;
		}

		.title {
			font-size: 2rem;
			font-weight: 700;
			margin-bottom: 0.75rem;
			color: var(--text-primary);
		}

		.subtitle {
			font-size: 1rem;
			color: var(--text-secondary);
			margin-bottom: 2rem;
			max-width: 500px;
			margin-left: auto;
			margin-right: auto;
		}

		.form {
			display: flex;
			gap: 0.5rem;
			margin-bottom: 2rem;
		}

		.input {
			flex: 1;
			padding: 0.875rem 1.25rem;
			font-size: 0.95rem;
			border: 2px solid var(--border);
			border-radius: var(--radius);
			background: var(--bg-secondary);
			color: var(--text-primary);
			transition: var(--transition);
			outline: none;
		}

		.input:focus {
			border-color: var(--accent);
			box-shadow: 0 0 0 4px rgba(232, 153, 128, 0.15);
		}

		.input::placeholder {
			color: var(--text-secondary);
			opacity: 0.6;
		}

		.button {
			padding: 0.875rem 2rem;
			font-size: 0.95rem;
			font-weight: 600;
			border: none;
			border-radius: var(--radius);
			background: var(--accent);
			color: white;
			cursor: pointer;
			transition: var(--transition);
			white-space: nowrap;
		}

		.button:hover {
			background: var(--accent-hover);
			transform: translateY(-2px);
			box-shadow: 0 4px 15px rgba(232, 153, 128, 0.4);
		}

		.button:active {
			transform: translateY(0);
		}

		.nodes {
			margin-top: 0.5rem;
			background: var(--bg-primary);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			box-shadow: var(--shadow);
			padding: 1rem 1.25rem;
			text-align: left;
		}

		.nodes-head {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 0.75rem;
		}

		.nodes-head h2 {
			font-size: 1rem;
			font-weight: 600;
			color: var(--text-primary);
		}

		.button-secondary {
			padding: 0.5rem 1rem;
			font-size: 0.875rem;
			font-weight: 600;
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			background: var(--bg-secondary);
			color: var(--text-primary);
			cursor: pointer;
			transition: var(--transition);
			white-space: nowrap;
		}

		.button-secondary:hover {
			background: var(--accent);
			color: white;
			border-color: var(--accent);
		}

		.button-secondary:disabled {
			opacity: 0.6;
			cursor: not-allowed;
		}

		.nodes-status {
			font-size: 0.85rem;
			color: var(--text-secondary);
			margin: 0.5rem 0 0.75rem;
		}

		.node-list {
			list-style: none;
		}

		.node-row {
			display: flex;
			align-items: center;
			gap: 0.75rem;
			width: 100%;
			padding: 0.625rem 0.875rem;
			font-size: 0.875rem;
			font-family: inherit;
			color: var(--text-secondary);
			background: transparent;
			border: none;
			border-radius: var(--radius-sm);
			cursor: pointer;
			transition: var(--transition);
			text-align: left;
		}

		.node-row:hover {
			background: var(--bg-secondary);
			color: var(--accent);
		}

		.node-row.selected {
			background: rgba(232, 153, 128, 0.12);
			color: var(--text-primary);
		}

		.node-check {
			width: 14px;
			height: 14px;
			fill: currentColor;
			flex-shrink: 0;
			color: var(--accent);
			visibility: hidden;
		}

		.node-row.selected .node-check {
			visibility: visible;
		}

		.node-name {
			font-weight: 600;
			color: var(--text-primary);
			white-space: nowrap;
		}

		.node-host {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.node-speed {
			margin-left: auto;
			font-size: 0.85rem;
			color: var(--text-secondary);
			white-space: nowrap;
		}

		.node-row.selected .node-speed {
			color: var(--accent);
			font-weight: 600;
		}

		.nodes-note {
			font-size: 0.8rem;
			color: var(--text-secondary);
			opacity: 0.75;
			margin-top: 0.75rem;
		}

		@media (max-width: 480px) {
			.nodes {
				padding: 0.875rem 1rem;
			}
		}

		.footer {
			padding: 1.5rem;
			text-align: center;
			color: var(--text-secondary);
			font-size: 0.85rem;
			border-top: 1px solid var(--border);
		}

		.footer a {
			color: var(--accent);
			text-decoration: none;
		}

		.footer a:hover {
			text-decoration: underline;
		}

		@media (max-width: 900px) {
			.nav-desktop {
				display: none;
			}

			.mobile-controls {
				display: flex;
			}

			.header {
				padding: 0.75rem 1rem;
			}

			.title {
				font-size: 1.5rem;
			}

			.subtitle {
				font-size: 0.9rem;
			}

			.icon-wrapper svg {
				height: 3rem;
			}

			.form {
				flex-direction: column;
			}

			.button {
				width: 100%;
			}
		}

		@media (max-width: 480px) {
			.main {
				padding: 5rem 1rem 2rem;
			}

			.title {
				font-size: 1.25rem;
			}

			.icon-wrapper svg {
				height: 2.5rem;
			}

			.subtitle {
				font-size: 0.85rem;
			}
		}

		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(20px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.container {
			animation: fadeIn 0.6s ease-out;
		}

		.menu-dropdown::before {
			content: '';
			position: absolute;
			top: -6px;
			right: 14px;
			border-left: 6px solid transparent;
			border-right: 6px solid transparent;
			border-bottom: 6px solid var(--border);
		}

		.menu-dropdown::after {
			content: '';
			position: absolute;
			top: -5px;
			right: 15px;
			border-left: 5px solid transparent;
			border-right: 5px solid transparent;
			border-bottom: 5px solid var(--bg-primary);
		}
	</style>
</head>

				<svg viewBox="0 0 496 512" aria-hidden="true"><path d="M165.9 397.4c0 2-2.3 3.6-5.2 3.6-3.3.3-5.6-1.3-5.6-3.6 0-2 2.3-3.6 5.2-3.6 3-.3 5.6 1.3 5.6 3.6zm-31.1-4.5c-.7 2 1.3 4.3 4.3 4.9 2.6 1 5.6 0 6.2-2s-1.3-4.3-4.3-5.2c-2.6-.7-5.5.3-6.2 2.3zm44.2-1.7c-2.9.7-4.9 2.6-4.6 4.9.3 2 2.9 3.3 5.9 2.6 2.9-.7 4.9-2.6 4.6-4.6-.3-1.9-3-3.2-5.9-2.9zM244.8 8C106.1 8 0 113.3 0 252c0 110.9 69.8 205.8 169.5 239.2 12.8 2.3 17.3-5.6 17.3-12.1 0-6.2-.3-40.4-.3-61.4 0 0-70 15-84.7-29.8 0 0-11.4-29.1-27.8-36.6 0 0-22.9-15.7 1.6-15.4 0 0 24.9 2 38.6 25.8 21.9 38.6 58.6 27.5 72.9 20.9 2.3-16 8.8-27.1 16-33.7-55.9-6.2-112.3-14.3-112.3-110.5 0-27.5 7.6-41.3 23.6-58.9-2.6-6.5-11.1-33.3 2.6-67.9 20.9-6.5 69 27 69 27 20-5.6 41.5-8.5 62.8-8.5s42.8 2.9 62.8 8.5c0 0 48.1-33.6 69-27 13.7 34.7 5.2 61.4 2.6 67.9 16 17.7 25.8 31.5 25.8 58.9 0 96.5-58.9 104.2-114.8 110.5 9.2 7.9 17 22.9 17 46.4 0 33.7-.3 75.4-.3 83.6 0 6.5 4.6 14.4 17.3 12.1C428.2 457.8 496 362.9 496 252 496 113.3 383.5 8 244.8 8zM97.2 352.9c-1.3 1-1 3.3.7 5.2 1.6 1.6 3.9 2.3 5.2 1 1.3-1 1-3.3-.7-5.2-1.6-1.6-3.9-2.3-5.2-1zm-10.8-8.1c-.7 1.3.3 2.9 2.3 3.9 1.6 1 3.6.7 4.3-.7.7-1.3-.3-2.9-2.3-3.9-2-.6-3.6-.3-4.3.7zm32.4 35.6c-1.6 1.3-1 4.3 1.3 6.2 2.3 2.3 5.2 2.6 6.5 1 1.3-1.3.7-4.3-1.3-6.2-2.2-2.3-5.2-2.6-6.5-1zm-11.4-14.7c-1.6 1-1.6 3.6 0 5.9 1.6 2.3 4.3 3.3 5.6 2.3 1.6-1.3 1.6-3.9 0-6.2-1.4-2.3-4-3.3-5.6-2z"/></svg>

				<ul class="node-list" id="nodeList"></ul>
				<p class="nodes-note">节点来自油猴脚本与公开公益节点；测速会下载一张测试图片，点一行可手动切换节点，下载走所选节点。</p>

	<script>
		function initTheme() {
			const savedTheme = localStorage.getItem('theme');
			if (savedTheme) {
				document.documentElement.setAttribute('data-theme', savedTheme);
				return savedTheme;
			} else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
				document.documentElement.setAttribute('data-theme', 'dark');
				return 'dark';
			}
			return 'light';
		}
		
		function toggleTheme() {
			const currentTheme = document.documentElement.getAttribute('data-theme');
			const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
			document.documentElement.setAttribute('data-theme', newTheme);
			localStorage.setItem('theme', newTheme);
		}
		
		initTheme();
		
		document.getElementById('themeToggle').addEventListener('click', (e) => {
			e.stopPropagation();
			toggleTheme();
		});
		
		document.getElementById('themeToggleMobile').addEventListener('click', (e) => {
			e.stopPropagation();
			toggleTheme();
		});
		
		const menuToggle = document.getElementById('menuToggle');
		const menuDropdown = document.getElementById('menuDropdown');
		
		menuToggle.addEventListener('click', (e) => {
			e.stopPropagation();
			menuDropdown.classList.toggle('active');
			menuToggle.classList.toggle('is-open', menuDropdown.classList.contains('active'));
		});
		
		menuDropdown.querySelectorAll('a').forEach(link => {
			link.addEventListener('click', () => {
				menuDropdown.classList.remove('active');
				menuToggle.classList.remove('is-open');
			});
		});
		
		document.addEventListener('click', (e) => {
			if (!menuDropdown.contains(e.target) && !menuToggle.contains(e.target)) {
				menuDropdown.classList.remove('active');
				menuToggle.classList.remove('is-open');
			}
		});
		
		document.querySelector('.input').focus();
		
		const form = document.querySelector('.form');
		const input = document.querySelector('.input');
		
		form.addEventListener('submit', (e) => {
			if (!input.validity.valid) {
				e.preventDefault();
				input.style.borderColor = '#ef4444';
				input.style.boxShadow = '0 0 0 4px rgba(239, 68, 68, 0.15)';
				
				setTimeout(() => {
					input.style.borderColor = '';
					input.style.boxShadow = '';
				}, 2000);
			}
		});
		
		input.addEventListener('input', () => {
			input.style.borderColor = '';
			input.style.boxShadow = '';
		});

		var NODES = [
			{ name: '本站', base: 'https://cdn.pixcat.cn/' },
			{ name: 'Ghfast', base: 'https://ghfast.top/' },
			{ name: 'Gh-Proxy', base: 'https://gh-proxy.com/' },
			{ name: 'GhProxyOrg', base: 'https://gh-proxy.org/' },
			{ name: 'CdnGhProxy', base: 'https://cdn.gh-proxy.org/' },
			{ name: 'GhEdgeOne', base: 'https://edgeone.gh-proxy.org/' },
			{ name: 'FastGitCc', base: 'https://fastgit.cc/' },
			{ name: 'Chjina', base: 'https://gh.chjina.com/' },
			{ name: 'Monlor', base: 'https://gh.monlor.com/' },
			{ name: 'Nxnow', base: 'https://gh.nxnow.top/' },
			{ name: 'Yylx', base: 'https://git.yylx.win/' },
			{ name: 'Ednovas', base: 'https://github.ednovas.xyz/' }
		];
		var TEST_IMAGE = 'https://raw.githubusercontent.com/AAswordman/OperitWeb/main/public/manuals/assets/workflow/01.png';
		var TEST_SIZE = 1363888;
		var TEST_TIMEOUT = 6000;
		var GF_SCRIPT_URL = 'https://update.greasyfork.org/scripts/412245/Github%20Enhancement%20-%20High%20Speed%20Download.user.js';
		var selectedBase = localStorage.getItem('ghproxy-node') || 'https://cdn.pixcat.cn/';
		if (!NODES.some(function (n) { return n.base === selectedBase; })) selectedBase = 'https://cdn.pixcat.cn/';
		var nodeListEl = document.getElementById('nodeList');
		var nodesStatusEl = document.getElementById('nodesStatus');
		var speedTestBtn = document.getElementById('speedTestBtn');
		var nodeResults = {};
		var isTesting = false;

		function nodeByBase(base) {
			for (var i = 0; i < NODES.length; i++) if (NODES[i].base === base) return NODES[i];
			return NODES[0];
		}

		function nodeHost(base) {
			return base.replace(/^https?:\/\//, '').replace(/\/$/, '');
		}

		function renderNodes() {
			nodeListEl.innerHTML = '';
			NODES.forEach(function (n) {
				var li = document.createElement('li');
				var btn = document.createElement('button');
				btn.type = 'button';
				btn.className = 'node-row' + (n.base === selectedBase ? ' selected' : '');
				var r = nodeResults[n.base];
				var speedText = r === undefined ? (isTesting ? '测速中…' : '—') : (r === null ? '失败' : r);
				btn.innerHTML = '<svg class="node-check" viewBox="0 0 448 512" aria-hidden="true"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg><span class="node-name"></span><span class="node-host"></span><span class="node-speed"></span>';
				btn.querySelector('.node-name').textContent = n.name;
				btn.querySelector('.node-host').textContent = n.name === nodeHost(n.base) ? '' : nodeHost(n.base);
				btn.querySelector('.node-speed').textContent = speedText;
				btn.addEventListener('click', function () { selectNode(n.base); });
				li.appendChild(btn);
				nodeListEl.appendChild(li);
			});
		}

		function selectNode(base) {
			selectedBase = base;
			localStorage.setItem('ghproxy-node', base);
			renderNodes();
			var cur = nodeByBase(base);
			nodesStatusEl.textContent = '当前节点：' + cur.name + '（' + nodeHost(cur.base) + '）';
		}

		function testNode(node) {
			return new Promise(function (resolve) {
				var img = new Image();
				var done = false;
				var start = performance.now();
				var timer = setTimeout(function () {
					if (done) return;
					done = true;
					img.src = '';
					resolve(null);
				}, TEST_TIMEOUT);
				img.onload = function () {
					if (done) return;
					done = true;
					clearTimeout(timer);
					var sec = (performance.now() - start) / 1000;
					if (sec <= 0) { resolve(null); return; }
					var mbps = (TEST_SIZE / 1048576) / sec;
					resolve(mbps >= 10 ? mbps.toFixed(1) + ' MB/s' : mbps.toFixed(2) + ' MB/s');
				};
				img.onerror = function () {
					if (done) return;
					done = true;
					clearTimeout(timer);
					resolve(null);
				};
				img.referrerPolicy = 'no-referrer';
				img.src = node.base + TEST_IMAGE + '?t=' + Date.now() + Math.floor(Math.random() * 1000);
			});
		}

		speedTestBtn.addEventListener('click', function () {
			if (isTesting) return;
			isTesting = true;
			speedTestBtn.disabled = true;
			speedTestBtn.textContent = '测速中…';
			nodeResults = {};
			var startBase = selectedBase;
			var finished = 0;
			renderNodes();
			nodesStatusEl.textContent = '正在测速… 0/' + NODES.length;
			Promise.all(NODES.map(function (n) {
				return testNode(n).then(function (r) {
					nodeResults[n.base] = r;
					finished++;
					renderNodes();
					nodesStatusEl.textContent = '正在测速… ' + finished + '/' + NODES.length;
					return { node: n, result: r };
				});
			})).then(function (all) {
				var best = null, bestMbps = -1;
				all.forEach(function (x) {
					if (x.result) {
						var v = parseFloat(x.result);
						if (v > bestMbps) { bestMbps = v; best = x.node; }
					}
				});
				isTesting = false;
				speedTestBtn.disabled = false;
				speedTestBtn.textContent = '节点测速';
				if (best) {
					if (selectedBase === startBase) {
						selectNode(best.base);
						nodesStatusEl.textContent = '最快：' + best.name + ' ' + nodeResults[best.base] + '，已自动切换';
					} else {
						renderNodes();
						nodesStatusEl.textContent = '最快：' + best.name + ' ' + nodeResults[best.base] + '，你手动选了 ' + nodeByBase(selectedBase).name + '，未切换';
					}
				} else {
					renderNodes();
					nodesStatusEl.textContent = '测速失败，仍使用当前节点';
				}
			});
		});

		form.addEventListener('submit', function (e) {
			if (!input.validity.valid) return;
			e.preventDefault();
			var u = input.value.trim();
			if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
			window.open(selectedBase + u, '_blank');
		});

		function refreshNodesFromScript() {
			var ctrl = new AbortController();
			var timer = setTimeout(function () { ctrl.abort(); }, 5000);
			fetch(GF_SCRIPT_URL, { signal: ctrl.signal }).then(function (res) {
				if (!res.ok) return null;
				return res.text();
			}).then(function (text) {
				clearTimeout(timer);
				if (!text) return;
				var clean = text.split('\n').filter(function (l) { return !l.trim().startsWith('//'); }).join('\n');
				var seen = {};
				NODES.forEach(function (n) { seen[nodeHost(n.base)] = true; });
				var added = 0;
				var re = /'(https:\/\/[a-zA-Z0-9.\-]+\/https:\/\/github\.com)'/g, m;
				while ((m = re.exec(clean)) && NODES.length < 20) {
					var base = m[1].replace(/\/https:\/\/github\.com$/, '/');
					if (!seen[nodeHost(base)]) {
						seen[nodeHost(base)] = true;
						NODES.push({ name: nodeHost(base), base: base });
						added++;
					}
				}
				if (added) renderNodes();
			}).catch(function () { clearTimeout(timer); });
		}

		selectNode(selectedBase);
		refreshNodesFromScript();
	</script>
</body>
