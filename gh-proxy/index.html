<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
	<title>GitHub 下载加速</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta property="og:title" content="GitHub 代理加速服务" />
	<meta property="og:description" content="ghproxy, GitHub 代理加速，Github 文件加速，Github 代理下载" />
	<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
	
	<style>
		:root {
			--bg-primary: #ffffff;
			--bg-secondary: #f8f9fa;
			--text-primary: #1a1a2e;
			--text-secondary: #4a4a6a;
			--accent: #e89980;
			--accent-hover: #d48870;
			--border: #e5e5e5;
			--shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
			--shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.12);
			--radius: 12px;
			--radius-sm: 8px;
			--transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
		}

		[data-theme="dark"] {
			--bg-primary: #1a1a2e;
			--bg-secondary: #16162a;
			--text-primary: #f0f0f5;
			--text-secondary: #a0a0b0;
			--border: #2a2a4a;
			--shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
			--shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.5);
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			background: var(--bg-primary);
			color: var(--text-primary);
			line-height: 1.6;
			transition: var(--transition);
			min-height: 100vh;
			display: flex;
			flex-direction: column;
		}

		.header {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			padding: 0.75rem 2rem;
			display: flex;
			justify-content: space-between;
			align-items: center;
			background: var(--bg-primary);
			box-shadow: var(--shadow);
			z-index: 1000;
			transition: var(--transition);
		}

		.logo {
			font-size: 1.1rem;
			font-weight: 600;
			color: var(--text-primary);
			text-decoration: none;
			display: flex;
			align-items: center;
			gap: 0.5rem;
		}

		.logo i {
			color: var(--accent);
		}

		.nav-desktop {
			display: flex;
			align-items: center;
			gap: 0.25rem;
		}

		.nav-desktop a {
			color: var(--text-secondary);
			text-decoration: none;
			font-size: 0.9rem;
			font-weight: 500;
			transition: var(--transition);
			padding: 0.5rem 0.875rem;
			border-radius: var(--radius-sm);
			white-space: nowrap;
		}

		.nav-desktop a:hover {
			color: var(--accent);
			background: var(--bg-secondary);
		}

		.theme-toggle {
			background: var(--bg-secondary);
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			width: 38px;
			height: 38px;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			transition: var(--transition);
			color: var(--text-primary);
			margin-left: 0.5rem;
		}

		.theme-toggle:hover {
			background: var(--accent);
			color: white;
			border-color: var(--accent);
		}

		.mobile-controls {
			display: none;
			align-items: center;
			gap: 0.5rem;
		}

		.action-btn {
			background: var(--bg-secondary);
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			width: 38px;
			height: 38px;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			transition: var(--transition);
			color: var(--text-primary);
		}

		.action-btn:hover,
		.action-btn:active,
		.action-btn:focus {
			background: var(--accent);
			color: white;
			border-color: var(--accent);
		}

		.mobile-menu {
			position: relative;
		}

		.menu-dropdown {
			position: absolute;
			top: calc(100% + 8px);
			right: 0;
			background: var(--bg-primary);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			box-shadow: var(--shadow-lg);
			padding: 0.5rem;
			min-width: 150px;
			opacity: 0;
			transform: translateY(-10px);
			pointer-events: none;
			transition: var(--transition);
			z-index: 1001;
		}

		.menu-dropdown.active {
			opacity: 1;
			transform: translateY(0);
			pointer-events: auto;
		}

		.menu-dropdown a {
			display: flex;
			align-items: center;
			gap: 0.75rem;
			padding: 0.625rem 0.875rem;
			color: var(--text-secondary);
			text-decoration: none;
			font-size: 0.875rem;
			border-radius: var(--radius-sm);
			transition: var(--transition);
		}

		.menu-dropdown a:hover {
			background: var(--bg-secondary);
			color: var(--accent);
		}

		.menu-dropdown a i {
			width: 18px;
			text-align: center;
			font-size: 0.875rem;
		}

		.main {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 6rem 2rem 3rem;
		}

		.container {
			max-width: 680px;
			width: 100%;
			text-align: center;
		}

		.icon-wrapper {
			margin-bottom: 1.5rem;
		}

		.icon-wrapper i {
			font-size: 4rem;
			color: var(--accent);
			opacity: 0.9;
		}

		.title {
			font-size: 2rem;
			font-weight: 700;
			margin-bottom: 0.75rem;
			color: var(--text-primary);
		}

		.subtitle {
			font-size: 1rem;
			color: var(--text-secondary);
			margin-bottom: 2rem;
			max-width: 500px;
			margin-left: auto;
			margin-right: auto;
		}

		.form {
			display: flex;
			gap: 0.5rem;
			margin-bottom: 2rem;
		}

		.input {
			flex: 1;
			padding: 0.875rem 1.25rem;
			font-size: 0.95rem;
			border: 2px solid var(--border);
			border-radius: var(--radius);
			background: var(--bg-secondary);
			color: var(--text-primary);
			transition: var(--transition);
			outline: none;
		}

		.input:focus {
			border-color: var(--accent);
			box-shadow: 0 0 0 4px rgba(232, 153, 128, 0.15);
		}

		.input::placeholder {
			color: var(--text-secondary);
			opacity: 0.6;
		}

		.button {
			padding: 0.875rem 2rem;
			font-size: 0.95rem;
			font-weight: 600;
			border: none;
			border-radius: var(--radius);
			background: var(--accent);
			color: white;
			cursor: pointer;
			transition: var(--transition);
			white-space: nowrap;
		}

		.button:hover {
			background: var(--accent-hover);
			transform: translateY(-2px);
			box-shadow: 0 4px 15px rgba(232, 153, 128, 0.4);
		}

		.button:active {
			transform: translateY(0);
		}

		.footer {
			padding: 1.5rem;
			text-align: center;
			color: var(--text-secondary);
			font-size: 0.85rem;
			border-top: 1px solid var(--border);
		}

		.footer a {
			color: var(--accent);
			text-decoration: none;
		}

		.footer a:hover {
			text-decoration: underline;
		}

		@media (max-width: 900px) {
			.nav-desktop {
				display: none;
			}

			.mobile-controls {
				display: flex;
			}

			.header {
				padding: 0.75rem 1rem;
			}

			.title {
				font-size: 1.5rem;
			}

			.subtitle {
				font-size: 0.9rem;
			}

			.icon-wrapper i {
				font-size: 3rem;
			}

			.form {
				flex-direction: column;
			}

			.button {
				width: 100%;
			}
		}

		@media (max-width: 480px) {
			.main {
				padding: 5rem 1rem 2rem;
			}

			.title {
				font-size: 1.25rem;
			}

			.icon-wrapper i {
				font-size: 2.5rem;
			}

			.subtitle {
				font-size: 0.85rem;
			}
		}

		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(20px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.container {
			animation: fadeIn 0.6s ease-out;
		}

		.menu-dropdown::before {
			content: '';
			position: absolute;
			top: -6px;
			right: 14px;
			border-left: 6px solid transparent;
			border-right: 6px solid transparent;
			border-bottom: 6px solid var(--border);
		}

		.menu-dropdown::after {
			content: '';
			position: absolute;
			top: -5px;
			right: 15px;
			border-left: 5px solid transparent;
			border-right: 5px solid transparent;
			border-bottom: 5px solid var(--bg-primary);
		}
	</style>
</head>
<body>
	<header class="header">
		<a href="./" class="logo">
			<i class="fab fa-github"></i>
			<span>GitHub 加速</span>
		</a>
		
		<nav class="nav-desktop">
			<a href="https://scriptcat.org/zh-CN/script-show-page/900" target="_blank" title="Github 加速脚本">
				<i class="fas fa-code"></i> 脚本
			</a>
			<a href="https://cdn.pixcat.cn/https://raw.githubusercontent.com/521xueweihan/GitHub520/main/hosts" target="_blank" title="Github 最新 hosts">
				<i class="fas fa-network-wired"></i> Hosts
			</a>
			<a href="https://favorites.pages.dev/" target="_blank">
				<i class="fas fa-compass"></i> 更多
			</a>
			<button class="theme-toggle" id="themeToggle" aria-label="切换主题">
				<i class="fas fa-moon"></i>
			</button>
		</nav>
		
		<div class="mobile-controls">
			<button class="action-btn" id="themeToggleMobile" aria-label="切换主题">
				<i class="fas fa-moon"></i>
			</button>
			<div class="mobile-menu">
				<button class="action-btn" id="menuToggle" aria-label="菜单">
					<i class="fas fa-bars"></i>
				</button>
				<div class="menu-dropdown" id="menuDropdown">
					<a href="https://scriptcat.org/zh-CN/script-show-page/900" target="_blank">
						<i class="fas fa-code"></i>
						<span>脚本</span>
					</a>
					<a href="https://cdn.pixcat.cn/https://raw.githubusercontent.com/521xueweihan/GitHub520/main/hosts" target="_blank">
						<i class="fas fa-network-wired"></i>
						<span>Hosts</span>
					</a>
					<a href="https://favorites.pages.dev/" target="_blank">
						<i class="fas fa-compass"></i>
						<span>更多</span>
					</a>
				</div>
			</div>
		</div>
	</header>

	<main class="main">
		<div class="container">
			<div class="icon-wrapper">
				<i class="fab fa-github"></i>
			</div>
			
			<h1 class="title">GitHub 下载加速</h1>
			<p class="subtitle">为 Releases、archive、gist 等文件提供代理加速下载服务</p>
			
			<form action="./" method="get" target="_blank" class="form">
				<input 
					class="input" 
					type="text" 
					name="q" 
					placeholder="粘贴 GitHub 文件链接"
					pattern="^((https|http):\/\/)?(github\.com\/.+?\/.+?\/(?:releases|archive|blob)|((?:raw|gist)\.(?:githubusercontent|github)\.com))\/.+$"
					required
					autocomplete="off"
				/>
				<button type="submit" class="button">
					<i class="fas fa-bolt"></i> 获取
				</button>
			</form>
		</div>
	</main>

	<footer class="footer">
		<p>&copy; <a href="./">GitHub 文件加速</a></p>
	</footer>

	<script>
		function initTheme() {
			const savedTheme = localStorage.getItem('theme');
			if (savedTheme) {
				document.documentElement.setAttribute('data-theme', savedTheme);
				return savedTheme;
			} else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
				document.documentElement.setAttribute('data-theme', 'dark');
				return 'dark';
			}
			return 'light';
		}
		
		function updateThemeIcon(theme) {
			const icons = document.querySelectorAll('#themeToggle i, #themeToggleMobile i');
			icons.forEach(icon => {
				icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
			});
		}
		
		function toggleTheme() {
			const currentTheme = document.documentElement.getAttribute('data-theme');
			const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
			document.documentElement.setAttribute('data-theme', newTheme);
			localStorage.setItem('theme', newTheme);
			updateThemeIcon(newTheme);
		}
		
		const currentTheme = initTheme();
		updateThemeIcon(currentTheme);
		
		document.getElementById('themeToggle').addEventListener('click', (e) => {
			e.stopPropagation();
			toggleTheme();
		});
		
		document.getElementById('themeToggleMobile').addEventListener('click', (e) => {
			e.stopPropagation();
			toggleTheme();
		});
		
		const menuToggle = document.getElementById('menuToggle');
		const menuDropdown = document.getElementById('menuDropdown');
		const menuIcon = menuToggle.querySelector('i');
		
		menuToggle.addEventListener('click', (e) => {
			e.stopPropagation();
			menuDropdown.classList.toggle('active');
			menuIcon.className = menuDropdown.classList.contains('active') ? 'fas fa-times' : 'fas fa-bars';
		});
		
		menuDropdown.querySelectorAll('a').forEach(link => {
			link.addEventListener('click', () => {
				menuDropdown.classList.remove('active');
				menuIcon.className = 'fas fa-bars';
			});
		});
		
		document.addEventListener('click', (e) => {
			if (!menuDropdown.contains(e.target) && !menuToggle.contains(e.target)) {
				menuDropdown.classList.remove('active');
				menuIcon.className = 'fas fa-bars';
			}
		});
		
		document.querySelector('.input').focus();
		
		const form = document.querySelector('.form');
		const input = document.querySelector('.input');
		
		form.addEventListener('submit', (e) => {
			if (!input.validity.valid) {
				e.preventDefault();
				input.style.borderColor = '#ef4444';
				input.style.boxShadow = '0 0 0 4px rgba(239, 68, 68, 0.15)';
				
				setTimeout(() => {
					input.style.borderColor = '';
					input.style.boxShadow = '';
				}, 2000);
			}
		});
		
		input.addEventListener('input', () => {
			input.style.borderColor = '';
			input.style.boxShadow = '';
		});
	</script>
</body>
</html>
