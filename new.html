	<script type="text/javascript">
		function handlePress(event) {
			this.classList.add('pressed');
		}

		function handleRelease(event) {
			this.classList.remove('pressed');
		}

		function handleCancel(event) {
			this.classList.remove('pressed');
		}

		function attachPress(button) {
			button.addEventListener('mousedown', handlePress);
			button.addEventListener('mouseup', handleRelease);
			button.addEventListener('mouseleave', handleCancel);
			button.addEventListener('touchstart', handlePress);
			button.addEventListener('touchend', handleRelease);
			button.addEventListener('touchcancel', handleCancel);
		}

		var buttons = document.querySelectorAll('.projectItem');
		buttons.forEach(attachPress);


		function toggleClass(selector, className) {
			var elements = document.querySelectorAll(selector);
			elements.forEach(function(element) {
				element.classList.toggle(className);
			});
		}

		function pop(imageURL) {
			var tcMainElement = document.querySelector(".tc-img");
			if (imageURL) {
				tcMainElement.src = imageURL;
			}
			toggleClass(".tc-main", "active");
			toggleClass(".tc", "active");
		}

		var tc = document.getElementsByClassName('tc');
		var tc_main = document.getElementsByClassName('tc-main');
		tc[0].addEventListener('click', function(event) {
			pop();
		});
		tc_main[0].addEventListener('click', function(event) {
			event.stopPropagation();
		});

		function setCookie(name, value, days) {
			var expires = "";
			if (days) {
				var date = new Date();
				date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
				expires = "; expires=" + date.toUTCString();
			}
			document.cookie = name + "=" + value + expires + "; path=/";
		}

		function getCookie(name) {
			var nameEQ = name + "=";
			var cookies = document.cookie.split(';');
			for (var i = 0; i < cookies.length; i++) {
				var cookie = cookies[i];
				while (cookie.charAt(0) == ' ') {
					cookie = cookie.substring(1, cookie.length);
				}
				if (cookie.indexOf(nameEQ) == 0) {
					return cookie.substring(nameEQ.length, cookie.length);
				}
			}
			return null;
		}

		document.addEventListener('DOMContentLoaded', function() {
			var html = document.querySelector('html');
			var themeState = getCookie("themeState") || "Light";
			var tanChiShe = document.getElementById("tanChiShe");

			function changeTheme(theme) {
				tanChiShe.src = "./static/svg/snake-" + theme + ".svg";
				html.dataset.theme = theme;
				setCookie("themeState", theme, 365);
				themeState = theme;
			}
			var Checkbox = document.getElementById('myonoffswitch')
			Checkbox.addEventListener('change', function() {
				if (themeState == "Dark") {
					changeTheme("Light");
				} else if (themeState == "Light") {
					changeTheme("Dark");
				} else {
					changeTheme("Dark");
				}
			});

			if (themeState == "Dark") {
				Checkbox.checked = false;
			}

			changeTheme(themeState);
			var pageLoading = document.querySelector("#zyyo-loading");
			setTimeout(function() {
				pageLoading.style.opacity = '0';
			}, 100);
		});
	</script>

	<script type="text/javascript">
		fetch('nav.json')
			.then(response => response.json())
			.then(data => {
				const container = document.getElementById('jsonList');
				const categories = data.categories || [];

				categories.forEach(category => {
					const titleElement = document.createElement('div');
					titleElement.className = 'title';
					titleElement.textContent = `${category.icon || ''} ${category.name}`;

					container.appendChild(titleElement);

					const projectListElement = document.createElement('div');
					projectListElement.className = 'projectList';

					const sites = (category.children || []).flatMap(child => child.sites || []);
					sites.forEach(site => {
						const projectItem = document.createElement('a');
						projectItem.className = 'projectItem a';
						projectItem.setAttribute('target', '_blank');
						projectItem.href = site.url;

						const projectItemLeft = document.createElement('div');
						projectItemLeft.className = 'projectItemLeft';

						const title = document.createElement('h1');
						title.textContent = site.title;

						const description = document.createElement('p');
						description.textContent = site.description;

						projectItemLeft.appendChild(title);
						projectItemLeft.appendChild(description);

						const projectItemRight = document.createElement('div');
						projectItemRight.className = 'projectItemRight';

						const img = document.createElement('img');
						img.src = site.icon;
						img.alt = site.name;

						projectItemRight.appendChild(img);

						projectItem.appendChild(projectItemLeft);
						projectItem.appendChild(projectItemRight);

						attachPress(projectItem);
						projectListElement.appendChild(projectItem);
					});

					container.appendChild(projectListElement);
				});
			})
			.catch(error => console.error('Error loading JSON:', error));
	</script>
