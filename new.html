		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				user-select: none;
				transition: background-color 0.2s ease;
			}
			a:hover, a:link, a:visited, a:active, a:focus {
				text-decoration: none;
				outline: none;
				border: none;
				color: inherit;
				-webkit-tap-highlight-color: rgba(0, 0, 0, 0);
			}
			::-webkit-scrollbar {
				width: 0px;
			}
			::-webkit-scrollbar-thumb {
				background-color: var(--main_text_color, #000000);
				border-radius: 8px;
				height: 20%;
			}
			::-webkit-scrollbar-track {
				background-color: var(--main_bg_color, linear-gradient(50deg, #a2d0ff, #ffffff));
			}
			body {
				height: 100%;
				min-height: 100vh;
				width: 100%;
				position: relative;
				font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
				background: var(--main_bg_color);
				background-repeat: no-repeat;
				background-size: cover;
				background-position: center;
				background-attachment: fixed;
				transition: color 0.1s ease;
				color: var(--main_text_color);
			}
			#nav-loading {
				transition: opacity 0.3s ease;
				background: radial-gradient(white, #d8eaff);
				background-size: 100%;
				background-position: center;
				height: 100%;
				width: 100%;
				position: fixed;
				z-index: 999999;
				margin-top: 0px;
				top: 0px;
				pointer-events: none;
				opacity: 1;
				display: flex;
				justify-content: center;
				align-items: center;
			}
			#nav-loading-center {
				height: 150px;
				width: 150px;
				position: relative;
				border-radius: 50%;
				background: #10b981;
				animation: zoom 1s linear infinite;
			}
			@keyframes zoom {
				0% {
					transform: scale(0);
					opacity: 1;
				}
				50% {
					opacity: 0.5;
				}
				100% {
					transform: scale(1);
					opacity: 0;
				}
			}
			.nav-filter {
				position: fixed;
				width: 100%;
				height: 100%;
				background: var(--back_filter_color);
				backdrop-filter: blur(var(--back_filter));
				-webkit-backdrop-filter: blur(var(--back_filter));
				z-index: -99999999;
			}
			.nav-main {
				width: 100%;
				margin: 0 auto;
				transition: transform 0.5s ease;
				max-width: 1100px;
				position: relative;
				display: flex;
				flex-direction: row;
			}
			.nav-content {
				width: 100%;
				display: flex;
				padding: 20px;
				position: relative;
				padding-bottom: 50px;
				flex-direction: column;
			}
			.welcome {
				font-size: 65px;
				font-weight: 800;
				margin: 20px 0;
			}
			.description {
				font-size: 20px;
				margin-top: 7px;
			}
			.iconContainer {
				width: 100%;
				height: 60px;
				display: flex;
				align-items: center;
				overflow-x: scroll;
				margin-top: 20px;
			}
			.iconContainer::-webkit-scrollbar {
				display: none;
			}
			.iconItem {
				width: 49px;
				height: 43px;
				box-sizing: border-box;
				border-radius: 7px;
				display: flex;
				margin-left: 10px;
				backdrop-filter: blur(var(--card_filter));
				-webkit-backdrop-filter: blur(var(--card_filter));
				background: var(--item_bg_color);
				align-items: center;
				justify-content: center;
				transition: width 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
				flex-shrink: 0;
			}
			.iconItem i, .iconItem svg {
				width: 22px;
				height: 22px;
				fill: var(--fill);
				font-size: 22px;
				margin-right: 3px;
			}
			.switch {
				width: 55px;
				height: 43px;
				box-sizing: border-box;
				border-radius: 7px;
				display: flex;
				margin-left: 10px;
				backdrop-filter: blur(var(--card_filter));
				-webkit-backdrop-filter: blur(var(--card_filter));
				background: var(--item_bg_color);
				align-items: center;
				justify-content: center;
				transition: width 1s ease, opacity 1s ease, transform 1s ease;
				flex-shrink: 0;
			}
			.iconTip {
				white-space: nowrap;
				display: none;
			}
			.iconItem:hover {
				width: 95px;
				transform: translateY(-2px);
				background: var(--item_hover_color);
			}
			.iconItem.wide:hover {
				width: 115px;
			}
			.iconItem:hover .iconTip {
				display: block;
			}
			.switch:hover {
				width: 55px;
				background: var(--item_hover_color);
			}
			.title {
				animation: cardIn 0.3s ease-out backwards;
				display: flex;
				align-items: center;
				font-size: 26px;
				font-weight: 800;
				margin: 20px 0;
				transition: transform 0.4s ease;
			}
			.title i, .title svg {
				margin-right: 8px;
				height: 26px;
				width: 26px;
				fill: var(--fill);
			}
			.title:hover {
				transform: translateY(-5px);
			}
			.projectList {
				display: flex;
				flex-wrap: wrap;
			}
			@keyframes cardIn {
				from {
					opacity: 0;
					transform: translateY(12px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}
			.projectItem {
				animation: cardIn 0.35s ease-out backwards;
				margin: 7px;
				display: flex;
				background-color: var(--item_bg_color);
				border-radius: 8px;
				padding: 15px;
				height: 100px;
				width: calc(25% - 15px);
				backdrop-filter: blur(var(--card_filter));
				-webkit-backdrop-filter: blur(var(--card_filter));
				transition: opacity 0.5s ease, background-color 0.2s ease, border 0.2s ease, transform 0.3s ease;
			}
			.projectItem:hover {
				box-shadow: 0 8px 16px -4px #2c2d300c;
				transform: translateY(-2px);
			}
			.projectItem:active {
				transform: scale(0.9);
				background-color: var(--item_hover_color);
			}
			.projectItem:hover .projectItemLeft {
				width: 100%;
			}
			.projectItem:hover .projectItemRight {
				width: 0%;
			}
			.projectItem:hover .projectItemRight img {
				transform: rotate(40deg);
			}
			.projectItem:hover h1 {
				font-size: 18px;
			}
			.projectItemLeft p {
				font-size: 12px;
				margin-top: 15px;
				color: var(--item_left_text_color);
			}
			.projectItemLeft h1 {
				font-weight: normal;
				font-size: 16px;
				margin: 0px;
				transition: font-size 0.4s ease;
				color: var(--item_left_title_color);
			}
			.projectItemLeft {
				transition: width 0.4s ease;
				height: 100%;
				width: 80%;
			}
			.projectItemRight {
				overflow: hidden;
				transition: width 0.4s ease;
				display: flex;
				justify-content: center;
				align-items: center;
				width: 20%;
				height: 100%;
			}
			.projectItemRight img {
				height: 39px;
				width: 39px;
				display: none;
			}
			footer {
				position: absolute;
				padding: 10px;
				text-align: center;
				width: 100%;
				backdrop-filter: blur(var(--card_filter));
				-webkit-backdrop-filter: blur(var(--card_filter));
				background: var(--item_bg_color);
				color: var(--footer_text_color);
				font-size: 13px;
				bottom: 0;
			}
			.onoffswitch {
				position: relative;
				width: 38px;
				height: 20px;
				flex-shrink: 0;
				-webkit-user-select: none;
				-moz-user-select: none;
				-ms-user-select: none;
			}
			.onoffswitch-checkbox {
				display: none;
			}
			.onoffswitch-label {
				display: block;
				width: 100%;
				height: 100%;
				border-radius: 999px;
				cursor: pointer;
				background: rgba(51, 65, 85, 0.55);
				backdrop-filter: blur(8px);
				-webkit-backdrop-filter: blur(8px);
				border: 1px solid rgba(255, 255, 255, 0.18);
				box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.25);
				transition: background 0.25s ease;
				overflow: hidden;
				position: relative;
			}
			.onoffswitch-checkbox:checked + .onoffswitch-label {
				background: rgba(226, 232, 240, 0.85);
				backdrop-filter: blur(8px);
				-webkit-backdrop-filter: blur(8px);
				border: 1px solid rgba(0, 0, 0, 0.08);
				box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.12);
			}
			.onoffswitch-inner {
				display: none;
			}
			.onoffswitch-switch {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 14px;
				height: 14px;
				background: #ffffff;
				border-radius: 50%;
				position: absolute;
				top: 3px;
				left: 21px;
				box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
				transition: left 0.25s ease;
				font-size: 13px;
				line-height: 1;
			}
			.onoffswitch-checkbox:checked + .onoffswitch-label .onoffswitch-switch {
				left: 3px;
			}
			@media (max-width: 1150px) {
				.a {
					width: calc(50% - 20px);
				}
				.projectItem {
					margin: 10px;
				}
			}
			@media (max-width: 800px) {
				.a .projectItemRight {
					display: none;
				}
				.a .projectItemRight img {
					display: none;
				}
				.a .projectItemLeft {
					width: 100%;
				}
				.a {
					width: calc(50% - 18px);
					margin: 9px;
				}
				.nav-content {
					width: 100%;
				}
				.description {
					font-size: 4vw;
				}
				.welcome {
					font-size: 10vw;
					margin: 2vw 0;
				}
				.iconContainer {
					margin-top: 4vw;
				}
				.projectItem {
					padding: 10px;
				}
				.projectItemLeft p {
					font-size: 13px;
				}
				.projectItemLeft h1 {
					font-size: 18px;
				}
				.projectItem:hover h1 {
					font-size: 20px;
				}
			}
		</style>
	</head>

	<script type="text/javascript">



		function setCookie(name, value, days) {
			var expires = "";
			if (days) {
				var date = new Date();
				date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
				expires = "; expires=" + date.toUTCString();
			}
			document.cookie = name + "=" + value + expires + "; path=/";
		}

		function getCookie(name) {
			var nameEQ = name + "=";
			var cookies = document.cookie.split(';');
			for (var i = 0; i < cookies.length; i++) {
				var cookie = cookies[i];
				while (cookie.charAt(0) == ' ') {
					cookie = cookie.substring(1, cookie.length);
				}
				if (cookie.indexOf(nameEQ) == 0) {
					return cookie.substring(nameEQ.length, cookie.length);
				}
			}
			return null;
		}

		document.addEventListener('DOMContentLoaded', function() {
			var html = document.querySelector('html');
			var themeState = getCookie("themeState") || "Light";

			function changeTheme(theme) {
				html.dataset.theme = theme;
				setCookie("themeState", theme, 365);
				themeState = theme;
			}
			var Checkbox = document.getElementById('myonoffswitch')
			Checkbox.addEventListener('change', function() {
				if (themeState == "Dark") {
					changeTheme("Light");
				} else if (themeState == "Light") {
					changeTheme("Dark");
				} else {
					changeTheme("Dark");
				}
			});

			if (themeState == "Dark") {
				Checkbox.checked = false;
			}

			changeTheme(themeState);
		});
	</script>

	<script type="text/javascript">
		fetch('nav.json')
			.then(response => response.json())
			.then(data => {
				const container = document.getElementById('jsonList');
				const categories = data.categories || [];

				categories.forEach(category => {
					const titleElement = document.createElement('div');
					titleElement.className = 'title';
					titleElement.style.animationDelay = '300ms';
					titleElement.textContent = `${category.icon || ''} ${category.name}`;

					container.appendChild(titleElement);

					const projectListElement = document.createElement('div');
					projectListElement.className = 'projectList';

					const sites = (category.children || []).flatMap(child => child.sites || []);
					sites.forEach((site, siteIndex) => {
						const projectItem = document.createElement('a');
						projectItem.style.animationDelay = (300 + Math.min(siteIndex * 8, 120)) + 'ms';
						projectItem.className = 'projectItem a';
						projectItem.setAttribute('target', '_blank');
						projectItem.href = site.url;

						const projectItemLeft = document.createElement('div');
						projectItemLeft.className = 'projectItemLeft';

						const title = document.createElement('h1');
						title.textContent = site.title;

						const description = document.createElement('p');
						description.textContent = site.description;

						projectItemLeft.appendChild(title);
						projectItemLeft.appendChild(description);

						const projectItemRight = document.createElement('div');
						projectItemRight.className = 'projectItemRight';

						const img = document.createElement('img');
						img.src = site.icon;
						img.alt = site.name;

						projectItemRight.appendChild(img);

						projectItem.appendChild(projectItemLeft);
						projectItem.appendChild(projectItemRight);

						projectListElement.appendChild(projectItem);
					});

					container.appendChild(projectListElement);
				});
				hideLoading();
			})
			.catch(error => {
				console.error('Error loading JSON:', error);
				hideLoading();
			});
		function hideLoading() {
			var pageLoading = document.querySelector("#nav-loading");
			if (pageLoading) {
				pageLoading.style.opacity = '0';
				setTimeout(function() { pageLoading.style.display = 'none'; }, 350);
			}
		}
	</script>
